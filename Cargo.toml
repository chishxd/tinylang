[package]
name = "tinylang-chishxd"
description = "A simple funny language written in Rust to learn lalrpop"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/chishxd/tinylang"
readme = "README.md"

[build-dependencies]
lalrpop = "0.23.1"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
lalrpop-util = { version = "0.23.1", features = ["lexer", "unicode"] }
ureq = "3.3.0"
